server {
  listen 80;
  root /usr/share/nginx/html;
  location /v1/ { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /realtime/ { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location = /agentdesk.js { proxy_pass http://api:4000; }
  location / { try_files $uri /index.html; }
}
